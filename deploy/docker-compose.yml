services:
  postgres:
    image: postgres:17-alpine
    container_name: shopverse-postgres
    environment:
      POSTGRES_USER: shopverse
      POSTGRES_PASSWORD: sh0P^eRs3
      POSTGRES_DB: shopverse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopverse -d shopverse"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: shopverse-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:
